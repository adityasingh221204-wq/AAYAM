name: Automated Verification Suite

on:
  push:
    branches: [main, trial]
  pull_request:
    branches: [main, trial]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the actual pytest suite
        id: pytest
        continue-on-error: true
        run: |
          mkdir -p reports
          python -m pytest tests/ -v --junitxml=reports/pytest.xml
      - name: Convert JUnit output into dashboard report
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/publish_verification_report.py reports/pytest.xml reports/publish/verification.json
      - name: Publish report to verification-results branch
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: verification-results
          publish_dir: reports/publish
          force_orphan: true
      - name: Fail workflow when tests fail
        if: steps.pytest.outcome != 'success'
        run: exit 1
