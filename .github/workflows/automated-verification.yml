name: Automated Verification Suite

on:
  push:
    branches: [main, trial]
  pull_request:
    branches: [main, trial]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the actual pytest suite
        id: pytest
        continue-on-error: true
        run: |
          mkdir -p reports
          python -m pytest tests/ -v --junitxml=reports/pytest.xml
      - name: Start Flask app and verify live HTTP routes
        run: |
          set -e
          python web/server.py > /tmp/aayam-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/ -o /tmp/aayam-home.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/aayam-home.html
          curl --fail --silent http://127.0.0.1:5000/opportunities -o /tmp/aayam-opportunities.html
          grep -q "opp_grid_container" /tmp/aayam-opportunities.html
          curl --fail --silent -X POST -H "Content-Type: application/json" -d '{}' http://127.0.0.1:5000/api/recommendations/rank -o /tmp/aayam-opportunities.json
          curl --fail --silent http://127.0.0.1:5000/api/system/smoke-test -o /tmp/aayam-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/aayam-smoke.json").read_text(encoding="utf-8"))
          assert payload.get("engine_checks_run") == 5, payload
          assert payload.get("engine_checks_failed") == 0, payload
          assert payload.get("status") == "success", payload
          assert str(payload.get("pytest_suite_status", "")).startswith("NOT RUN"), payload
          opportunities = json.loads(Path("/tmp/aayam-opportunities.json").read_text(encoding="utf-8"))
          ranked = opportunities.get("ranked", [])
          assert opportunities.get("status") == "success", opportunities
          assert len(ranked) == 12, f"Expected 12 pathways, got {len(ranked)}"
          tracks = {str(item.get("track", "")).strip().lower() for item in ranked}
          assert "employment" in tracks, tracks
          assert "micro-enterprise" in tracks, tracks
          assert "self-employment" in tracks, tracks
          print("Live Flask smoke checks passed: homepage, opportunities page, all 12 pathways, and 5 engine checks.")
          PY
      - name: Convert JUnit output into dashboard report
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/publish_verification_report.py reports/pytest.xml reports/publish/verification.json
      - name: Publish report to verification-results branch
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/trial'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: verification-results
          publish_dir: reports/publish
          force_orphan: true
      - name: Fail workflow when tests fail
        if: steps.pytest.outcome != 'success'
        run: exit 1
